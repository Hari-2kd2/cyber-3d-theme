<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#181a30"/>
      <stop offset="70%" stop-color="#0a0b12"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="gridGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#ff007f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#core)"/>
  <!-- 3D Perspective Grid -->
  <g stroke="url(#gridGrad)" stroke-width="1.5">
    <!-- Horizon Line -->
    <line x1="0" y1="650" x2="1920" y2="650" stroke="#00e5ff" stroke-opacity="0.8" stroke-width="2"/>
    <!-- Perspective Rays -->
    <line x1="960" y1="650" x2="0" y2="1080"/>
    <line x1="960" y1="650" x2="240" y2="1080"/>
    <line x1="960" y1="650" x2="480" y2="1080"/>
    <line x1="960" y1="650" x2="720" y2="1080"/>
    <line x1="960" y1="650" x2="960" y2="1080"/>
    <line x1="960" y1="650" x2="1200" y2="1080"/>
    <line x1="960" y1="650" x2="1440" y2="1080"/>
    <line x1="960" y1="650" x2="1680" y2="1080"/>
    <line x1="960" y1="650" x2="1920" y2="1080"/>
    <!-- Horizontal Grid Lines with 3D Depth Spacing -->
    <line x1="0" y1="660" x2="1920" y2="660" opacity="0.2"/>
    <line x1="0" y1="675" x2="1920" y2="675" opacity="0.3"/>
    <line x1="0" y1="700" x2="1920" y2="700" opacity="0.4"/>
    <line x1="0" y1="740" x2="1920" y2="740" opacity="0.5"/>
    <line x1="0" y1="800" x2="1920" y2="800" opacity="0.6"/>
    <line x1="0" y1="890" x2="1920" y2="890" opacity="0.7"/>
    <line x1="0" y1="1020" x2="1920" y2="1020" opacity="0.8"/>
  </g>
  <!-- Cyber Sun / Core -->
  <circle cx="960" cy="520" r="120" fill="#ff007f" opacity="0.15" filter="blur(20px)"/>
  <circle cx="960" cy="520" r="70" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.8"/>
</svg>